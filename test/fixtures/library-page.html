<!doctype html>
<html lang="en" data-base="/Stories">
<head><meta charset="utf-8"><title>Stories</title></head>
<body>
  <main id="view">
    <section data-mount="continue"></section>
    <section data-mount="played-lately"></section>
    <div data-mount="world-switcher"></div>
    <input type="search" data-mount="search" aria-label="Search stories">
    <div data-mount="filters"></div>
    <div class="library-bar"><p id="library-status" role="status" aria-live="polite" data-role="results-status"></p><div data-role="sort-slot"></div></div>
    <ul id="stories"></ul>
    <p id="no-results" data-role="no-results" role="status" hidden></p>
  </main>
  <nav data-mount="dock"></nav>
</body>
</html>
